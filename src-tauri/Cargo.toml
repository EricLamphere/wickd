[package]
name = "wickd"
version = "1.4.1"
description = "wickd desktop app"
edition = "2021"

[lib]
name = "wickd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2"

[dev-dependencies]
# "test" = tauri::test (mock runtime), used to check IPC access from the backend's origin.
tauri = { version = "2", features = ["tray-icon", "test"] }
