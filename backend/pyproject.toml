[project]
name = "wickd-backend"
version = "1.1.0"
description = "FastAPI backend for wickd, an open-source local UI wrapper around dbt-core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "sse-starlette>=2.1.3",
    "watchfiles>=0.24.0",
    "dbt-artifacts-parser>=0.8.1",
    "pyyaml>=6.0.2",
    "ruamel.yaml>=0.18",
    "ptyprocess>=0.7.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "sqlglot>=24.0.0,<30.22",  # 30.22 breaks wickd-pro column lineage (empty results); re-test before raising
    "platformdirs>=4.3.0",
    "httpx>=0.27.2",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff==0.17.1",  # pinned: ruff's default rules change between releases; bump deliberately
]
packaging = [
    "pyinstaller>=6.11.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and params as call defaults; they're evaluated per request.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# Tests build git fixtures with blocking subprocess calls; nothing else shares their event loop.
"tests/**" = ["ASYNC221"]
